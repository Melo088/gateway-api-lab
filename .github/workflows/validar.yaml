name: validar

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifiestos:
    runs-on: ubuntu-24.04
    env:
      KUBECONFORM_VERSION: v0.8.0
      CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
    steps:
      - uses: actions/checkout@v7

      - name: Instalar kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform

      - name: Validar kustomizations
        run: |
          set -euo pipefail
          for dir in comun */manifests; do
            [[ -f "$dir/kustomization.yaml" ]] || continue
            echo "::group::$dir"
            kubectl kustomize "$dir" | kubeconform -strict -summary -ignore-missing-schemas \
              -schema-location default -schema-location "$CRD_SCHEMAS"
            echo "::endgroup::"
          done

      - name: Validar scripts
        run: shellcheck scripts/*.sh
