# Pod con dos contenedores:
#   ingress-controller (KIC): plano de control. Traduce Gateway API a
#     configuración de Kong y la envía a la Admin API local (localhost:8444).
#   proxy (Kong Gateway): plano de datos en modo DB-less (configuración en memoria).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: kong
  labels:
    app.kubernetes.io/name: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kong
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kong
    spec:
      serviceAccountName: kong
      initContainers:
      # Borra el PID de un arranque anterior para que Kong pueda reiniciar.
      - name: clear-stale-pid
        image: kong:3.8.0
        command: [rm, -vrf, /kong_prefix/pids]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: prefix
          mountPath: /kong_prefix/
      containers:
      - name: ingress-controller
        image: kong/kubernetes-ingress-controller:3.5.0
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # Admin API del contenedor proxy (mismo pod).
        - name: CONTROLLER_KONG_ADMIN_URL
          value: https://localhost:8444
        - name: CONTROLLER_KONG_ADMIN_TLS_SKIP_VERIFY
          value: 'true'
        # Service cuya IP se publica en status.addresses del Gateway.
        - name: CONTROLLER_PUBLISH_SERVICE
          value: kong/kong-proxy
        - name: CONTROLLER_ELECTION_ID
          value: kong-ingress-controller-leader-kong
        - name: CONTROLLER_INGRESS_CLASS
          value: kong
        ports:
        - name: cstatus
          containerPort: 10254
        readinessProbe:
          httpGet:
            path: /readyz
            port: cstatus
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: cstatus
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
      - name: proxy
        image: kong:3.8.0
        env:
        - name: KONG_DATABASE
          value: 'off'
        - name: KONG_PREFIX
          value: /kong_prefix/
        # Proxy HTTP en 8000 y HTTPS en 8443; el Service los expone como 80/443.
        - name: KONG_PROXY_LISTEN
          value: 0.0.0.0:8000, 0.0.0.0:8443 http2 ssl
        - name: KONG_PORT_MAPS
          value: 80:8000, 443:8443
        # Admin API solo en localhost: únicamente KIC la usa.
        - name: KONG_ADMIN_LISTEN
          value: 127.0.0.1:8444 http2 ssl
        - name: KONG_STATUS_LISTEN
          value: 0.0.0.0:8100
        - name: KONG_STREAM_LISTEN
          value: 'off'
        - name: KONG_CLUSTER_LISTEN
          value: 'off'
        - name: KONG_ROUTER_FLAVOR
          value: traditional
        - name: KONG_NGINX_WORKER_PROCESSES
          value: '2'
        - name: KONG_PROXY_ACCESS_LOG
          value: /dev/stdout
        - name: KONG_PROXY_ERROR_LOG
          value: /dev/stderr
        - name: KONG_ADMIN_ACCESS_LOG
          value: /dev/stdout
        - name: KONG_ADMIN_ERROR_LOG
          value: /dev/stderr
        - name: KONG_STATUS_ERROR_LOG
          value: /dev/stderr
        ports:
        - name: proxy
          containerPort: 8000
        - name: proxy-tls
          containerPort: 8443
        - name: status
          containerPort: 8100
        readinessProbe:
          httpGet:
            path: /status/ready
            port: status
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /status
            port: status
          initialDelaySeconds: 5
          periodSeconds: 10
        lifecycle:
          preStop:
            exec:
              command: [kong, quit, --wait=15]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: prefix
          mountPath: /kong_prefix/
        - name: tmp
          mountPath: /tmp
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: prefix
        emptyDir:
          sizeLimit: 256Mi
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
