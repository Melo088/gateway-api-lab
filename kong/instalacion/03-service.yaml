# Expone 80/443 hacia los puertos 8000/8443 del proxy Kong.
# En minikube, la IP externa la asigna minikube tunnel.
# targetPort numérico: KIC lo compara con KONG_PROXY_LISTEN para aceptar los
# listeners del Gateway; con un nombre de puerto quedan en UnsupportedProtocol.
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  namespace: kong
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: kong
  ports:
  - name: proxy
    port: 80
    targetPort: 8000
  - name: proxy-tls
    port: 443
    targetPort: 8443
