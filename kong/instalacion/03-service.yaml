apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: kong-gateway
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kong
    app.kubernetes.io/version: '3.8.0'
    enable-metrics: 'true'
    helm.sh/chart: kong-3.4.1
  name: kong-gateway-kong-proxy
  namespace: kong
spec:
  ports:
  - name: kong-proxy
    port: 80
    protocol: TCP
    targetPort: 8000
  - name: kong-proxy-tls
    port: 443
    protocol: TCP
    targetPort: 8443
  selector:
    app.kubernetes.io/component: app
    app.kubernetes.io/instance: kong-gateway
    app.kubernetes.io/name: kong
  type: LoadBalancer
