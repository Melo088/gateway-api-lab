# Rango de IPs para Services LoadBalancer y anuncio L2 (ARP) en la red de minikube.
#   kubectl apply -f cilium/instalacion/lb-ipam.yaml
# El rango debe pertenecer a la subred del nodo: con el driver kvm2, minikube
# usa 192.168.39.0/24 (comprobar con `minikube ip`).
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: gateway-lab
spec:
  blocks:
    - start: 192.168.39.200
      stop: 192.168.39.220
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: gateway-lab
spec:
  loadBalancerIPs: true
  interfaces:
    - ^eth[0-9]+
