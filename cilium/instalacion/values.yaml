# Valores declarativos de Cilium para Gateway API (instalación sin cliente Helm externo).
# Utilizados por el Cilium CLI: cilium install -f cilium/instalacion/values.yaml

# 1. Reemplazo completo de kube-proxy mediante eBPF
kubeProxyReplacement: true

# 2. Habilitación del controlador nativo de Gateway API en Cilium
gatewayAPI:
  enabled: true
  # Expone los secrets TLS en todos los namespaces si es necesario
  secretsNamespace:
    create: false

# 3. Optimización de enrutamiento y proxy Envoy L7
bpf:
  masquerade: true

# 4. Configuración del operador de Cilium
operator:
  replicas: 1
