# E06. Redirección HTTP a HTTPS con código 301. Soporte: Core.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: e06-redirect
spec:
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - redirect.lab.local
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
