# E01. Enrutamiento por hostname y path. Soporte: Core.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: e01-enrutamiento
spec:
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - enrutamiento.lab.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: httpbin-v1
          port: 8080
