# E03. Distribución de tráfico por pesos 80/20. Soporte: Core.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: e03-pesos
spec:
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - pesos.lab.local
  rules:
    - backendRefs:
        - name: httpbin-v1
          port: 8080
          weight: 80
        - name: httpbin-v2
          port: 8080
          weight: 20
