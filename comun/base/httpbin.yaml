# Backend de prueba en dos versiones (v1, v2) para escenarios de matching y pesos.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-v1
  labels:
    app: httpbin
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
      version: v1
  template:
    metadata:
      labels:
        app: httpbin
        version: v1
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:2.25.0
          env:
            # /hostname devuelve el nombre del pod; identifica la versión que respondió.
            - name: USE_REAL_HOSTNAME
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /status/200
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin-v1
  labels:
    app: httpbin
    version: v1
spec:
  selector:
    app: httpbin
    version: v1
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
