# Pod de Traefik: plano de control (proveedor kubernetesgateway) y plano de
# datos (entrypoints web y websecure) en el mismo proceso.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: traefik
  labels:
    app.kubernetes.io/name: traefik
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: docker.io/traefik:v3.7.14
          args:
            # Entrypoints: los listeners del Gateway deben usar estos puertos.
            - --entryPoints.traefik.address=:8080/tcp
            - --entryPoints.web.address=:8000/tcp
            - --entryPoints.websecure.address=:8443/tcp
            - --entryPoints.websecure.http.tls=true
            - --ping=true
            - --providers.kubernetesgateway
            # Service cuya IP se publica en status.addresses del Gateway.
            - --providers.kubernetesgateway.statusaddress.service.name=traefik
            - --providers.kubernetesgateway.statusaddress.service.namespace=traefik
            - --log.level=INFO
          ports:
            - name: traefik
              containerPort: 8080
            - name: web
              containerPort: 8000
            - name: websecure
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /ping
              port: traefik
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: traefik
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
