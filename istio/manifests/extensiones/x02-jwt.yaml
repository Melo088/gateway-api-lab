# X02. Autenticación JWT en el Gateway.
# RequestAuthentication valida la firma de los tokens presentes (inválido: 401).
# AuthorizationPolicy exige un token válido en jwt.lab.local (ausente: 403).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: x02-jwt
  namespace: gateway-lab
spec:
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - jwt.lab.local
  rules:
    - backendRefs:
        - name: httpbin-v1
          port: 8080
---
# JWKS de muestra de Istio (security/tools/jwt/samples/jwks.json, release 1.31.2).
# Va inline para no depender de que istiod descargue jwksUri desde internet.
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: x02-jwt
  namespace: gateway-lab
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: gateway
  jwtRules:
    - issuer: testing@secure.istio.io
      jwks: |
        {"keys":[{"e":"AQAB","kid":"DHFbpoIUqrY8t2zpA2qXfCmr5VO5ZEr4RzHU_-envvQ","kty":"RSA","n":"xAE7eB6qugXyCAG3yhh7pkDkT65pHymX-P7KfIupjf59vsdo91bSP9C8H07pSAGQO1MV_xFj9VswgsCg4R6otmg5PV2He95lZdHtOcU5DXIg_pbhLdKXbi66GlVeK6ABZOUW3WYtnNHD-91gVuoeJT_DwtGGcp4ignkgXfkiEm4sw-4sfb4qdt5oLbyVpmW6x9cfa7vs2WTfURiCrBoUqgBo_-4WTiULmmHSGZHOjzwa8WtrtOQGsAFjIbno85jp6MnGGGZPYZbDAa_b3y5u-YpW7ypZrvD8BgtKVjgtQgZhLAGezMt0ua3DRrWnKqTZ0BJ_EyxOGuHJrLsn00fnMQ"}]}
      # El claim sub llega al backend como header x-jwt-sub.
      outputClaimToHeaders:
        - header: x-jwt-sub
          claim: sub
---
# notRequestPrincipals ["*"]: peticiones sin identidad JWT validada.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: x02-jwt
  namespace: gateway-lab
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: gateway
  action: DENY
  rules:
    - from:
        - source:
            notRequestPrincipals:
              - "*"
      to:
        - operation:
            # Puerto del listener http; sin él, Istio advierte que la regla
            # también bloquearía tráfico TCP no HTTP.
            ports:
              - "80"
            hosts:
              - jwt.lab.local
              - jwt.lab.local:*
