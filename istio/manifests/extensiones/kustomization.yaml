# Extensiones de Istio (X01-X03) sobre el overlay de E01-E07.
#   kubectl apply -k istio/manifests/extensiones
#   istio/manifests/extensiones/verificar.sh
# Kustomize no admite referenciar el directorio padre (../ sería un ciclo), por
# lo que se parte de comun/ y se repite el patch de gatewayClassName.
# Los recursos propios declaran su namespace porque X03 usa también fuera-mesh.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../comun
  - x01-authz.yaml
  - x02-jwt.yaml
  - x03-mesh.yaml
patches:
  - target:
      kind: Gateway
      name: gateway
    patch: |-
      - op: replace
        path: /spec/gatewayClassName
        value: istio
  # X03: inscribe los pods de gateway-lab en el mesh ambient.
  - target:
      kind: Namespace
      name: gateway-lab
    patch: |-
      - op: add
        path: /metadata/labels/istio.io~1dataplane-mode
        value: ambient
  # X03: el tráfico interno hacia httpbin-v1 pasa por el waypoint.
  - target:
      kind: Service
      name: httpbin-v1
    patch: |-
      - op: add
        path: /metadata/labels/istio.io~1use-waypoint
        value: waypoint
